type: object
description:
  $ref: "./descriptions/ResponseErrorLambda.md"
required:
  - errorMessage
  - errorType
properties:
  errorMessage:
    type: string
    description: |
      エラーメッセージ。
      例 "Response payload size exceeded maximum allowed payload size (6291556 bytes)."。
  errorType:
    type: string
    description: エラー種別。例 "Function.ResponseSizeTooLarge"。
