type: object
description:
  $ref: "./descriptions/ResponseExceptionReport.md"
required:
  - version
  - exceptions
properties:
  version:
    type: string
    description: WFS バージョン。例 "2.0.0"。
  exceptions:
    type: array
    description: 発生した例外の配列。
    items:
      type: object
      required:
        - code
        - text
      properties:
        code:
          type: string
          description: 例外コード。例 "InvalidParameterValue"。
        locator:
          type: string
          description: 例外の対象。例 "typeName"。
        text:
          type: string
          description: 例外メッセージ。
