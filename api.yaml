                          下り・超音波異常: '0'
                          下り・欠測: '0'
                          道路種別: '3'
                          時間コード: 202502100900
                    totalFeatures: 1
                    numberMatched: 1
                    numberReturned: 1
                    timeStamp: '2025-03-26T10:20:44.761Z'
                    crs:
                      type: name
                      properties:
                        name: urn:ogc:def:crs:EPSG::4326
                format2:
                  summary: 様式 2（常設トラカン 1 時間交通量）
                  value:
                    type: FeatureCollection
                    features:
                      - type: Feature
                        id: t_travospublic_measure_1h.4693500.202502100900
                        geometry:
                          type: MultiPoint
                          coordinates:
                            - - 139.203293
