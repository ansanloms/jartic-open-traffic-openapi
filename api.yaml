openapi: 3.2.1
info:
  version: 1.0.0
  title: 国土交通省 交通量 API（JARTIC）
  description: |
    # jartic-open-traffic-openapi

    国土交通省交通量 API（JARTIC が提供する交通量データのオープン化 API）の非公式 OpenAPI 定義。

    常設型トラフィックカウンターおよび CCTV 映像を活用した AI 型トラフィックカウンターで観測された、全国の方向別交通量データを取得する API を記述する。実体は GeoServer の WFS 2.0.0 `GetFeature` であり、エンドポイントは 1 本のみ。取得する様式（データ種別）は `typeNames` の値で切り替える。

    ## 様式

    | 様式  | typeNames                       | 観測機器     | 集計単位    | 検索可能期間 |
    | ----- | ------------------------------- | ------------ | ----------- | ------------ |
    | 様式1 | `t_travospublic_measure_5m`     | 常設トラカン | 5分間交通量 | 過去1か月分  |
    | 様式2 | `t_travospublic_measure_1h`     | 常設トラカン | 1時間交通量 | 過去3か月分  |
    | 様式3 | `t_travospublic_measure_5m_img` | CCTVトラカン | 5分間交通量 | 過去1か月分  |
    | 様式4 | `t_travospublic_measure_1h_img` | CCTVトラカン | 1時間交通量 | 過去3か月分  |

    ## 出典

    - ガイダンスサイト: <https://www.jartic-open-traffic.org/>
    - 交通量 API 仕様書（API リクエストの作成方法）令和 8 年 1 月版
    - 交通量データ利用の手引き令和 7 年 5 月版

    ## 留意事項

    - この定義は上記の公開資料を基に作成した非公式のものであり、国土交通省・JARTIC が公開・保証するものではない。
    - `cql_filter` は CQL 文字列であり、OpenAPI の型では内部文法（道路種別・時間コード・BBOX）を強制できない。`getGeoserver` の説明および例を参照すること。
    - 仕様書の API 概要表には「認証方式有」と記載があるが、リクエストに認証情報を渡すパラメータの記載がなく、例示 URL も無認証であるため、本定義では `securitySchemes` を定義していない。
    - `outputFormat` は `application/json`（GeoJSON）と `csv` を取り得るが、本定義ではレスポンスを GeoJSON のみ記述する。
    - 提供されるデータは正式な交通量の調査結果ではなく、精度が変動する場合がある。利用には「交通量 API 利用規約」への事前同意が必要。
servers:
  - url: https://api.jartic-open-traffic.org
    description: 本番環境。
paths:
  /geoserver:
    get:
      operationId: getGeoserver
      summary: 交通量データの取得（WFS GetFeature）。
      tags:
        - traffic
      description: |
        常設型トラフィックカウンターおよび CCTV 映像を活用した AI 型トラフィックカウンターで観測された、全国の方向別交通量データを取得する。

        実体は GeoServer の WFS 2.0.0 `GetFeature` であり、エンドポイントは 1 本のみ。取得する様式（データ種別）は `typeNames` の値で切り替える。

        ## 様式（typeNames）

        | 様式  | typeNames                       | 観測機器     | 集計単位    | 検索可能期間 |
        | ----- | ------------------------------- | ------------ | ----------- | ------------ |
        | 様式1 | `t_travospublic_measure_5m`     | 常設トラカン | 5分間交通量 | 過去1か月分  |
        | 様式2 | `t_travospublic_measure_1h`     | 常設トラカン | 1時間交通量 | 過去3か月分  |
        | 様式3 | `t_travospublic_measure_5m_img` | CCTVトラカン | 5分間交通量 | 過去1か月分  |
        | 様式4 | `t_travospublic_measure_1h_img` | CCTVトラカン | 1時間交通量 | 過去3か月分  |

        `features[].properties` の項目は様式により異なる。様式 1・2 はループ／超音波などの機器状態フラグを、様式 3・4 はカメラや映像解析に関する状態フラグを持つ。

        ## リクエスト例

        ```
        https://api.jartic-open-traffic.org/geoserver?service=WFS&version=2.0.0&request=GetFeature&typeNames=t_travospublic_measure_5m&srsName=EPSG:4326&outputFormat=application/json&exceptions=application/json&cql_filter=道路種別=3 AND 時間コード=202502100900 AND BBOX(ジオメトリ,139.15,35.141,139.32,35.56,'EPSG:4326')
        ```

        ## 注意事項

        - 各種トラカンは観測条件により精度が大きく変動する場合がある。本データには気象状況等の環境要因や機器故障等により正確でないデータが含まれることがあり、国土交通省による正式な交通量の調査結果ではない。職員によるデータチェックは実施していない。
        - 近畿地方整備局の管轄エリアにおける CCTV トラカンの観測値は、システム上の都合により当面は様式 3（5 分間交通量）のみの提供となる。
        - 本 API の利用には「交通量 API 利用規約」への事前同意が必要。
      parameters:
        - in: query
          name: service
          required: true
          description: '"WFS" を指定する。'
          schema:
            $ref: '#/components/schemas/EnumService'
        - in: query
          name: version
          required: true
          description: '"2.0.0" を指定する。'
          schema:
            $ref: '#/components/schemas/EnumVersion'
        - in: query
          name: request
          required: true
          description: '"GetFeature" を指定する。'
          schema:
            $ref: '#/components/schemas/EnumRequest'
        - in: query
          name: typeNames
          required: true
          description: レイヤ名（様式）を指定する。半角カンマ区切りで複数指定も可能。
          schema:
            $ref: '#/components/schemas/EnumTypeNames'
        - in: query
          name: srsName
          required: true
          description: '"EPSG:4326"（世界測地系）を指定する。'
          schema:
            $ref: '#/components/schemas/EnumSrsName'
        - in: query
          name: outputFormat
          required: true
          description: |
            レスポンスの形式を指定する。
            "application/json" を指定した場合は GeoJSON 形式、"csv" を指定した場合は CSV 形式となる。
            本仕様書では "application/json"（GeoJSON）のレスポンスを定義する。
          schema:
            $ref: '#/components/schemas/EnumOutputFormat'
        - in: query
          name: exceptions
          required: false
          description: |
            エラーレスポンスの形式を指定する。
            "application/json" を指定した場合は JSON 形式、未指定時は XML 形式となる。
          schema:
            $ref: '#/components/schemas/EnumExceptions'
        - in: query
          name: cql_filter
          required: true
          description: |
            CQL フィルタ。次の項目を AND 条件で連結して指定する。
            道路種別（必須）は高速自動車国道なら 1、一般国道なら 3 を `"道路種別"='3'` の形式で指定する。
            時間コード（必須）は `"時間コード"=YYYYMMDDhhmm` で指定する。範囲指定は `"時間コード">=... AND "時間コード"<=...` の形式とする。5 分値は分を 5 の倍数へ切り捨てる。1 時間値は分を 00 へ切り捨てる。
            座標指定（任意）は BBOX 関数で緯度経度の範囲を絞り込む。書式は下部の例を参照する。
            常時観測点コード（任意）は `"常時観測点コード"=01234567` のように 0 埋めで指定する。
          schema:
            type: string
            example: '"道路種別"=''3'' AND "時間コード"=202502100900 AND BBOX("ジオメトリ",139.15,35.141,139.32,35.56,''EPSG:4326'')'
      responses:
        '200':
          description: |
            処理成功時。GeoJSON FeatureCollection を返す。
            合致する計測箇所が存在しない場合も 200 で返り、features は空配列となる。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseFeatureCollection'
              examples:
                format1:
                  summary: 様式 1（常設トラカン 5 分間交通量）
                  value:
                    type: FeatureCollection
                    features:
                      - type: Feature
                        id: t_travospublic_measure_5m.4693500.202502100900
                        geometry:
                          type: MultiPoint
