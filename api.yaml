        default:
          description: |
            エラー時のレスポンス。複数の形式がある。HTTP ステータスコードは形式により異なる。
            必須パラメータの欠落は HTTP 400 で `{message}` を返す。
            `exceptions=application/json` 指定時の WFS 例外は `{version, exceptions}` を返す（HTTP 200 のことがある）。
            `exceptions` 未指定時は XML の ExceptionReport を返す。
            ペイロードサイズ超過時は `{errorMessage, errorType}` を返す。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseErrorJson'
              examples:
                missingParameter:
                  summary: 必須パラメータ欠落（HTTP 400）。
                  value:
                    message: 'Missing required request parameters: [typeNames]'
                exceptionJson:
                  summary: WFS 例外（exceptions=application/json 指定時）。
                  value:
                    version: 2.0.0
                    exceptions:
                      - code: InvalidParameterValue
                        locator: typeName
                        text: Feature type :t_travospublic_measure_50m unknown
                payloadTooLarge:
                  summary: ペイロードサイズ超過。
                  value:
                    errorMessage: Response payload size exceeded maximum allowed payload size (6291556 bytes).
                    errorType: Function.ResponseSizeTooLarge
            text/xml:
              schema:
                $ref: '#/components/schemas/ResponseErrorXml'
              examples:
                exceptionReport:
                  summary: データ種別の記述不正。
                  value: |
                    <?xml version="1.0" encoding="UTF-8"?><ows:ExceptionReport xmlns:ows="http://www.opengis.net/ows/1.1" version="2.0.0"><ows:Exception exceptionCode="InvalidParameterValue" locator="typeName"><ows:ExceptionText>Feature type :t_travospublic_measure_50m unknown</ows:ExceptionText></ows:Exception></ows:ExceptionReport>
components:
  schemas:
    Crs:
      type: object
      description: |
        座標参照系（CRS）の情報。
      required:
        - type
        - properties
      properties:
        type:
          type: string
          const: name
          description: 座標参照系項目タイプ。固定値 "name"。
        properties:
          type: object
          description: CRS のプロパティ。
          required:
            - name
          properties:
            name:
              type: string
              const: urn:ogc:def:crs:EPSG::4326
              description: 座標参照系名称。固定値 "urn:ogc:def:crs:EPSG::4326"。
    Feature:
      type: object
      description: |
        取得結果 1 件分のフィーチャ。計測箇所の位置情報と交通量データの組。
      required:
        - type
        - geometry
        - geometry_name
        - properties
      properties:
        type:
          type: string
          const: Feature
          description: 属性項目タイプ。固定値 "Feature"。
        id:
          type: string
          description: 「情報種別名.一意識別子」形式の ID。例 "t_travospublic_measure_5m.4693500.202502100900"。
        geometry:
          $ref: '#/components/schemas/GeometryMultiPoint'
        geometry_name:
          type: string
          const: ジオメトリ
          description: ジオメトリ属性名。固定値 "ジオメトリ"。
        properties:
          description: 交通量データ。指定した様式（typeNames）により項目が異なる。
          oneOf:
            - $ref: '#/components/schemas/PropertiesFormat1'
            - $ref: '#/components/schemas/PropertiesFormat2'
            - $ref: '#/components/schemas/PropertiesFormat3'
            - $ref: '#/components/schemas/PropertiesFormat4'
    GeometryMultiPoint:
      type: object
      description: |
        観測地点の位置情報。GeoJSON の MultiPoint 形式。
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          const: MultiPoint
          description: ジオメトリオブジェクトタイプ。固定値 "MultiPoint"。
        coordinates:
          type: array
          description: 観測地点を描画するための緯度経度の組合せ。各要素は[経度、 緯度]。
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
            example:
              - 139.203293
              - 35.37445003
    PropertiesBase:
      type: object
      description: |
        全様式に共通する交通量データの属性。
      properties:
        地方整備局等番号:
          type: integer
          description: |
            81:北海道、82:東北、83:関東、84:北陸、85:中部、86:近畿、87:中国、88:四国、89:九州、90:沖縄。
        開発建設部／都道府県コード:
          type: string
          description: |
            北海道・中部以外は空欄。
            北海道は 01:札幌、02:函館、03:小樽、04:旭川、05:室蘭、06:釧路、07:帯広、08:網走、09:留萌、10:稚内。
            中部は 21:岐阜県、22:静岡県、23:愛知県、24:三重県。
        常時観測点コード:
          type: integer
          description: 常時観測点コード。
        収集時間フラグ（5分間／1時間）:
          $ref: '#/components/schemas/EnumCollectionTimeFlag'
          description: 1:5 分間、2:1 時間。
        観測年月日:
          type: integer
          description: YYYYMMDD で表記。
        時間帯:
          type: integer
          description: 観測時刻を表す。様式 1〜3 は hhmm 形式で返す。様式 4 は時のみで 0〜23 の値となる。
        道路種別:
          $ref: '#/components/schemas/EnumRoadType'
        時間コード:
          type: integer
          format: int64
          description: 観測年月日+時間帯（YYYYMMDDhhmm）。
    PropertiesFormat1:
      description: |
        様式 1（常設トラカン 5 分間交通量）の属性。
      allOf:
        - $ref: '#/components/schemas/PropertiesBase'
        - type: object
          description: 様式 1（常設トラカン 5 分間交通量）固有の属性。
          properties:
            上り・小型交通量:
              type:
                - integer
                - 'null'
              description: 単位:台／5 分。欠測の場合は null。
            上り・大型交通量:
              type:
                - integer
                - 'null'
              description: 単位:台／5 分。欠測の場合は null。
            上り・車種判別不能交通量:
              type:
                - integer
                - 'null'
              description: 単位:台／5 分。欠測の場合は null。
            上り・停電:
              $ref: '#/components/schemas/EnumPowerFailure'
              description: 0:正常、1:停電。
            上り・ループ異常:
              $ref: '#/components/schemas/EnumAbnormality'
              description: 0:正常、1:異常。
            上り・超音波異常:
              $ref: '#/components/schemas/EnumAbnormality'
              description: 0:正常、1:異常。
            上り・欠測:
              $ref: '#/components/schemas/EnumMissing'
              description: 0:正常、1:欠測。
