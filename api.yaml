                            - - 139.203293
                              - 35.37445003
                        geometry_name: ジオメトリ
                        properties:
                          地方整備局等番号: 83
                          開発建設部／都道府県コード: ''
                          常時観測点コード: 3110640
                          収集時間フラグ（5分間／1時間）: '1'
