    EnumAbnormality:
      type: string
      description: |
        0:正常、1:異常。
      enum:
        - '0'
        - '1'
    EnumAbnormalityOrUndetermined:
      type: string
      description: |
        判定可能の場合は 0:正常、1:異常。判定不能の場合は空文字。
      enum:
        - '0'
        - '1'
        - ''
    EnumCollectionTimeFlag:
      type: string
      description: |
        1:5 分間、2:1 時間。
      enum:
        - '1'
        - '2'
    EnumExceptions:
      type: string
      description: |
        エラーレスポンスの形式。"application/json" は JSON 形式、未指定時は XML 形式となる。
      enum:
        - application/json
    EnumFiveMinuteMissingProcessingFlag:
      type: string
      description: |
        1:5 分処理、2:1 時間。0 も返るが仕様書に記載なし。
      enum:
        - '0'
        - '1'
        - '2'
    EnumMissing:
      type: string
      description: |
        0:正常、1:欠測。
      enum:
        - '0'
        - '1'
    EnumOutputFormat:
      type: string
      description: |
        レスポンスの形式。"application/json" は GeoJSON 形式、"csv" は CSV 形式となる。
      enum:
        - application/json
        - csv
    EnumPowerFailure:
      type: string
      description: |
        0:正常、1:停電。
      enum:
        - '0'
        - '1'
    EnumRequest:
      type: string
      description: |
        "GetFeature" を指定する。
      enum:
        - GetFeature
    EnumRoadType:
      type: string
      description: |
        道路種別。常時観測点に紐づくコード。1:高速自動車国道、3:一般国道。
      enum:
        - '1'
        - '3'
    EnumService:
      type: string
      description: |
        "WFS" を指定する。
      enum:
        - WFS
    EnumSrsName:
      type: string
      description: |
        "EPSG:4326"（世界測地系）を指定する。
      enum:
        - EPSG:4326
    EnumTypeNames:
      type: string
      description: |
        取得対象のレイヤ名（様式）。typeNames に指定する。

        - `t_travospublic_measure_5m`: 様式 1 常設トラカン 5 分間交通量
        - `t_travospublic_measure_1h`: 様式 2 常設トラカン 1 時間交通量
        - `t_travospublic_measure_5m_img`: 様式 3 CCTV トラカン 5 分間交通量（画像認識型）
        - `t_travospublic_measure_1h_img`: 様式 4 CCTV トラカン 1 時間交通量（画像認識型）
      enum:
        - t_travospublic_measure_5m
        - t_travospublic_measure_1h
        - t_travospublic_measure_5m_img
        - t_travospublic_measure_1h_img
    EnumVersion:
      type: string
      description: |
        "2.0.0" を指定する。
      enum:
        - 2.0.0
    ResponseErrorJson:
      description: |
        エラーレスポンス（JSON）。
      oneOf:
        - $ref: '#/components/schemas/ResponseErrorMessage'
        - $ref: '#/components/schemas/ResponseExceptionReport'
        - $ref: '#/components/schemas/ResponseErrorLambda'
    ResponseErrorLambda:
      type: object
      description: |
        レスポンスのペイロードサイズ超過などで返る JSON 形式のエラー（基盤の Lambda 由来）。
        期間や範囲を狭めて再リクエストする必要がある。
      required:
        - errorMessage
        - errorType
      properties:
        errorMessage:
          type: string
          description: |
            エラーメッセージ。
            例 "Response payload size exceeded maximum allowed payload size (6291556 bytes)."。
        errorType:
          type: string
          description: エラー種別。例 "Function.ResponseSizeTooLarge"。
    ResponseErrorMessage:
      type: object
      description: |
        必須パラメータの欠落など、リクエスト記述の不備で返る JSON 形式のエラー。
      required:
        - message
      properties:
        message:
          type: string
          description: 'エラーメッセージ。例 "Missing required request parameters: [typeNames]"。'
    ResponseErrorXml:
      type: string
      description: |
        WFS の ExceptionReport（XML）。exceptions 未指定時に返る。
    ResponseExceptionReport:
      type: object
      description: |
        `exceptions=application/json` を指定したときに返る WFS 例外。HTTP ステータスは 200 で返ることがある。
      required:
        - version
        - exceptions
      properties:
        version:
          type: string
          description: WFS バージョン。例 "2.0.0"。
        exceptions:
          type: array
          description: 発生した例外の配列。
          items:
            type: object
            required:
              - code
              - text
            properties:
              code:
                type: string
                description: 例外コード。例 "InvalidParameterValue"。
              locator:
                type: string
                description: 例外の対象。例 "typeName"。
              text:
                type: string
                description: 例外メッセージ。
    ResponseFeatureCollection:
      type: object
      description: |
        WFS GetFeature のレスポンス。GeoJSON FeatureCollection 形式。
        リクエストに合致する計測箇所が存在しない場合も HTTP 200 で返り、features は空配列、crs は null となる。
      required:
        - type
        - features
        - totalFeatures
        - numberMatched
        - numberReturned
        - timeStamp
      properties:
        type:
          type: string
          const: FeatureCollection
          description: GeoJSON オブジェクトタイプ。固定値 "FeatureCollection"。
        features:
          type: array
          description: 取得した結果（n 件）を格納する。
          items:
            $ref: '#/components/schemas/Feature'
        totalFeatures:
          type: integer
          description: レスポンス対象となったデータのシステム管理用件数。
        numberMatched:
          type: integer
          description: リクエストに一致した件数。
        numberReturned:
          type: integer
          description: 返却した件数。計測箇所および交通量データ一式を 1 としてカウントする。
        timeStamp:
          type: string
          format: date-time
          description: リクエストを処理した日時。
        crs:
          description: 座標参照系。合致する計測箇所が存在しない場合は null。
          oneOf:
            - $ref: '#/components/schemas/Crs'
            - type: 'null'
